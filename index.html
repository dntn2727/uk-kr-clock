:root {
  /* 원칙: 따뜻한 색은 '해'에만 쓴다 (후광·막대). 나머지는 중립 + 차가운 포인트 하나 */
  --bg: #000;
  --time: #F4F1EC;      /* 주인공: 따뜻한 흰색 */
  --weekday: #AAB4FA;   /* 포인트: 연보라 (밤하늘 남색과 같은 계열) */
  --date: #80859D;      /* 보조: 남색 기운 회색 */
  --ring: #5F6DE0;
  --ring-track: #14151C;
  --divider: #262833;
  --pin: #F4F1EC;
  --night: #1A2040;
  --ease: cubic-bezier(.65, 0, .35, 1);
  --dur: 1.4s;
}
/* 비교용: 처음 시안 색 (?theme=classic) */
:root[data-theme="classic"] {
  --time: #F4EFE6; --weekday: #FF7A59; --date: #F2C14E;
  --ring: #2EC4B6; --ring-track: #1B1B20; --divider: #3A3A41;
}
html, body {
  margin: 0; height: 100%;
  background: var(--bg);
  overflow: hidden;
}
body {
  font-family: "PXB", "Apple SD Gothic Neo", -apple-system, sans-serif;
  font-weight: 800;
  color: var(--time);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

/* 상태바(홈 화면 앱) 아래 영역만 사용 */
#screen {
  position: fixed;
  top: env(safe-area-inset-top); right: env(safe-area-inset-right);
  bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
}

/* ---- 초 테두리 ---- */
#ring { position: absolute; inset: 0; width: 100%; height: 100%; }
#ring path { fill: none; stroke-width: 8; stroke-linecap: butt; stroke-linejoin: miter; }
#ring .track { stroke: var(--ring-track); }
#ring .fill  { stroke: var(--ring); }
#ring .flash { stroke: var(--ring); opacity: 0; }
#ring .flash.go { animation: flash .9s ease-out; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }

/* ---- 1080×810 기준 무대, 화면에 맞춰 스케일 ---- */
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1080px; height: 810px;
  transform: translate(-50%, -50%) scale(var(--s, 1));
}
.c { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; line-height: 1; }
.anim, .anim * { transition: left var(--dur) var(--ease), top var(--dur) var(--ease),
  width var(--dur) var(--ease), height var(--dur) var(--ease), opacity var(--dur) var(--ease); }
.init, .init *, #stage.init .halo, #stage.init .flag { transition: none !important; }
#screen { animation: appear 1.2s ease-out both; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }

/* 국기 + 해 후광 */
.halo {
  position: absolute; width: 300px; height: 300px; border-radius: 50%;
  transform: translate(-50%, -50%) scale(var(--hs, .6));
  opacity: var(--ho, .2);
  background: radial-gradient(circle closest-side,
    rgba(var(--hc), 1) 0%, rgba(var(--hc), .62) 36%, rgba(var(--hc), .22) 62%, rgba(var(--hc), 0) 100%);
  transition: transform 30s linear, opacity 30s linear, background 30s linear !important;
}
.flag {
  width: 108px; height: 108px; border-radius: 50%; overflow: hidden;
  filter: brightness(var(--fb, 1)) saturate(var(--fsat, 1));
  box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .08), 0 0 22px 3px rgba(var(--hc), calc(var(--ho) * .8));
  transition: filter 30s linear, box-shadow 30s linear !important;
}
.flag svg, .pin-head svg { display: block; width: 100%; height: 100%; }

.weekday { font-size: 84px; font-weight: 700; color: var(--weekday); letter-spacing: -1px; }
.time    { font-size: 144px; letter-spacing: -2px; display: flex; align-items: center; }
/* 콜론 위치 고정: 시는 오른쪽, 분은 왼쪽 정렬 → 숫자가 바뀌어도 화면이 흔들리지 않음 */
.time .hh, .time .mm { width: 1.3em; }
.time .hh { text-align: right; }
.time .mm { text-align: left; }
/* 콜론은 글꼴 대신 작은 점 두 개로: 숫자보다 가볍게 */
.time .colon { display: flex; flex-direction: column; gap: .24em; margin: 0 .09em; }
.time .colon i { display: block; width: .095em; height: .095em; border-radius: 50%; background: var(--time); opacity: .6; }
.date    { font-size: 54px; font-weight: 700; color: var(--date); }

.divider {
  position: absolute; left: 540px; width: 0;
  border-left: 2px dashed var(--divider);
  transform: translateX(-50%);
}

/* 타임라인: 나라별 하루 한 줄, 색은 그날 해의 고도 (영국 = 위 줄, 한국 = 아래 줄) */
.lane {
  position: absolute; border-radius: 4px; overflow: hidden;
  background: var(--night);
}
.lane::after { /* 6시·12시·18시 눈금 */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg,
    transparent calc(25% - 1px), rgba(0,0,0,.55) calc(25% - 1px), rgba(0,0,0,.55) calc(25% + 1px), transparent calc(25% + 1px),
    transparent calc(50% - 1px), rgba(0,0,0,.55) calc(50% - 1px), rgba(0,0,0,.55) calc(50% + 1px), transparent calc(50% + 1px),
    transparent calc(75% - 1px), rgba(0,0,0,.55) calc(75% - 1px), rgba(0,0,0,.55) calc(75% + 1px), transparent calc(75% + 1px));
}
/* 핀은 막대 위가 기본. 같은 날(두 줄이 겹칠 때)만 한국 핀이 아래 줄을 가리키도록 내려감 */
.pin { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); }
.pin.below { flex-direction: column-reverse; transform: translate(-50%, 0); }
.anim .pin { transition: left var(--dur) var(--ease), top var(--dur) var(--ease), transform var(--dur) var(--ease); }
.pin-head { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; box-sizing: border-box; border: 3px solid var(--pin); background: var(--pin); box-shadow: 0 2px 8px rgba(0, 0, 0, .7); }
.pin-tail { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; }
.pin .pin-tail { margin-top: -1px; border-top: 10px solid var(--pin); }
.pin.below .pin-tail { margin: 0 0 -1px; border-top: 0; border-bottom: 10px solid var(--pin); }

/* 세로 화면 안내 */
#rotate {
  display: none; position: fixed; inset: 0; background: #000; z-index: 10;
  align-items: center; justify-content: center; flex-direction: column; gap: 24px;
  color: var(--time); font-size: 40px;
}
#rotate svg { width: 96px; height: 96px; }
@media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="ukT"><path d="M15,15h15v15zv15h-15zh-15v-15zv-15h15z"/></clipPath>
  </defs>
  <symbol id="sym-uk" viewBox="0 0 30 30">
    <rect width="30" height="30" fill="#012169"/>
    <path d="M0,0L30,30M30,0L0,30" stroke="#fff" stroke-width="6"/>
    <path d="M0,0L30,30M30,0L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/>
    <path d="M15,0v30M0,15h30" stroke="#fff" stroke-width="10"/>
    <path d="M15,0v30M0,15h30" stroke="#C8102E" stroke-width="6"/>
  </symbol>
  <symbol id="sym-kr" viewBox="-29 -29 58 58">
    <rect x="-30" y="-30" width="60" height="60" fill="#fff"/>
    <g transform="rotate(33.69)">
      <circle r="12" fill="#0047A0"/>
      <path d="M-12,0A12,12 0 0 1 12,0A6,6 0 0 0 0,0A6,6 0 0 1 -12,0Z" fill="#CD2E3A"/>
    </g>
    <g fill="#000">
      <!-- 건 ☰ (좌상) -->
      <g transform="rotate(-146.31)"><rect x="18" y="-6" width="2" height="12"/><rect x="21" y="-6" width="2" height="12"/><rect x="24" y="-6" width="2" height="12"/></g>
      <!-- 곤 ☷ (우하) -->
      <g transform="rotate(33.69)"><rect x="18" y="-6" width="2" height="5.5"/><rect x="18" y=".5" width="2" height="5.5"/><rect x="21" y="-6" width="2" height="5.5"/><rect x="21" y=".5" width="2" height="5.5"/><rect x="24" y="-6" width="2" height="5.5"/><rect x="24" y=".5" width="2" height="5.5"/></g>
      <!-- 감 ☵ (우상) -->
      <g transform="rotate(-33.69)"><rect x="18" y="-6" width="2" height="5.5"/><rect x="18" y=".5" width="2" height="5.5"/><rect x="21" y="-6" width="2" height="12"/><rect x="24" y="-6" width="2" height="5.5"/><rect x="24" y=".5" width="2" height="5.5"/></g>
      <!-- 리 ☲ (좌하) -->
      <g transform="rotate(146.31)"><rect x="18" y="-6" width="2" height="12"/><rect x="21" y="-6" width="2" height="5.5"/><rect x="21" y=".5" width="2" height="5.5"/><rect x="24" y="-6" width="2" height="12"/></g>
    </g>
  </symbol>
</svg>

<div id="screen">
  <svg id="ring" aria-hidden="true">
    <path class="track"/>
    <path class="flash"/>
    <path class="fill"/>
  </svg>

  <div id="stage" class="init">
    <div class="divider" id="divider"></div>

    <div class="halo" id="halo-uk" style="left:270px;top:132px"></div>
    <div class="halo" id="halo-kr" style="left:810px;top:132px"></div>
    <div class="c flag" id="flag-uk" style="left:270px;top:132px"><svg><use href="#sym-uk"/></svg></div>
    <div class="c flag" id="flag-kr" style="left:810px;top:132px"><svg><use href="#sym-kr"/></svg></div>

    <div class="c weekday" id="wd-uk"></div>
    <div class="c weekday" id="wd-kr"></div>

    <div class="c time" id="time-uk" style="left:270px;top:424px"><span class="hh"></span><span class="colon"><i></i><i></i></span><span class="mm"></span></div>
    <div class="c time" id="time-kr" style="left:810px;top:424px"><span class="hh"></span><span class="colon"><i></i><i></i></span><span class="mm"></span></div>

    <div class="lane" id="lane-uk"></div>
    <div class="lane" id="lane-kr"></div>
    <div class="pin uk" id="pin-uk"><div class="pin-head"><svg><use href="#sym-uk"/></svg></div><div class="pin-tail"></div></div>
    <div class="pin kr" id="pin-kr"><div class="pin-head"><svg><use href="#sym-kr"/></svg></div><div class="pin-tail"></div></div>

    <div class="c date" id="date-uk"></div>
    <div class="c date" id="date-kr"></div>
  </div>
</div>

<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M8 3.5c2.5-1.3 5.5-1.3 8 0M14.5 2l1.5 1.5-1.5 1.5"/></svg>
  <div>가로로 돌려주세요</div>
</div>

<script>
(() => {
  // ---------- 설정 ----------
  const ZONES = {
    uk: { tz: 'Europe/London', lat: 51.5074, lon: -0.1278 },   // 런던
    kr: { tz: 'Asia/Seoul',    lat: 37.5665, lon: 126.9780 },  // 서울
  };
  const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  // 무대 좌표 (1080×810 기준)
  // lane: [x, y, 너비, 높이] — 같은 날엔 두 줄을 겹쳐 쌓고, 다른 날엔 좌우로 나눔
  const L = {
    merged: { wdY: 276, dateY: 706, divTop: 366, divH: 116,
              uk: [60, 568, 960, 12], kr: [60, 583, 960, 12] },
    split:  { wdY: 276, dateY: 668, divTop: 44, divH: 722,
              uk: [60, 568, 420, 27], kr: [600, 568, 420, 27] },
  };

  // ---------- 시간 소스 (테스트용 ?at=ISO&speed=N) ----------
  const q = new URLSearchParams(location.search);
  const at = q.has('at') ? Date.parse(q.get('at')) : NaN;
  const speed = Number(q.get('speed')) || 1;
  const t0 = isNaN(at) ? Date.now() : at, p0 = performance.now();
  const simulated = !isNaN(at) || speed !== 1;
  if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  const now = () => simulated ? t0 + (performance.now() - p0) * speed : Date.now();

  const fmts = {};
  for (const k in ZONES) {
    fmts[k] = new Intl.DateTimeFormat('en-US', {
      timeZone: ZONES[k].tz, hourCycle: 'h23',
      year: 'numeric', month: 'numeric', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
  }
  function zoned(t, k) {
    const o = {};
    for (const p of fmts[k].formatToParts(t)) o[p.type] = p.value;
    const y = +o.year, m = +o.month, d = +o.day, h = +o.hour % 24, mi = +o.minute, s = +o.second;
    return { y, m, d, h, mi, s, dow: new Date(Date.UTC(y, m - 1, d)).getUTCDay(), key: y * 10000 + m * 100 + d };
  }

  // ---------- 태양 고도 (근사식, 오차 ~0.5°) ----------
  function sunElevation(t, lat, lon) {
    const rad = Math.PI / 180;
    const n = t / 86400000 + 2440587.5 - 2451545.0;
    const Lm = (280.460 + 0.9856474 * n) % 360;
    const g = ((357.528 + 0.9856003 * n) % 360) * rad;
    const lam = (Lm + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
    const gmst = ((18.697374558 + 24.06570982441908 * n) % 24 + 24) % 24;
    const ha = (gmst * 15 + lon) * rad - ra;
    const el = Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha));
    return el / rad;
  }
  // 고도 → [r, g, b, 후광 불투명도, 후광 크기, 국기 밝기]
  const SUN = [
    [-90, [ 60,  85, 170, .20, .54, .30]],
    [-18, [ 60,  85, 170, .20, .54, .30]],
    [-12, [110,  90, 210, .45, .65, .38]],   // 새벽/밤 어스름: 보랏빛 (막대 색과 같은 흐름)
    [ -6, [170, 100, 215, .80, .76, .55]],
    [ -2, [240, 105, 130, .74, .78, .82]],   // 해 뜨기 직전/진 직후: 장밋빛
    [  3, [255, 140,  60, .70, .79, 1.0]],
    [ 12, [255, 185,  80, .85, .87, 1.0]],
    [ 30, [255, 215, 120, .95, .94, 1.0]],
    [ 60, [255, 238, 170, 1.0, 1.0, 1.0]],
    [ 90, [255, 238, 170, 1.0, 1.0, 1.0]],
  ];
  function sunLook(el) {
    for (let i = 1; i < SUN.length; i++) {
      if (el <= SUN[i][0]) {
        const [e0, a] = SUN[i - 1], [e1, b] = SUN[i];
        const f = Math.max(0, Math.min(1, (el - e0) / (e1 - e0)));
        return a.map((v, j) => v + (b[j] - v) * f);
      }
    }
    return SUN[SUN.length - 1][1];
  }

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const stage = $('stage'), screenEl = $('screen');
  const ringSvg = $('ring');
  const [track, flash, fill] = ['track', 'flash', 'fill'].map(c => ringSvg.querySelector('.' + c));
  let perimeter = 1;

  function layoutScreen() {
    const w = screenEl.clientWidth, h = screenEl.clientHeight, i = 4; // 선 두께의 절반
    ringSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const d = `M${w / 2},${i}H${w - i}V${h - i}H${i}V${i}H${w / 2}`;
    for (const p of [track, flash, fill]) p.setAttribute('d', d);
    perimeter = 2 * ((w - 2 * i) + (h - 2 * i));
    for (const p of [flash, fill]) p.style.strokeDasharray = `${perimeter} ${perimeter}`;
    flash.style.strokeDashoffset = 0;
    const pad = 12;
    stage.style.setProperty('--s', Math.min((w - pad) / 1080, (h - pad) / 810));
  }
  addEventListener('resize', layoutScreen);

  const setText = (el, v) => { if (el.textContent !== v) el.textContent = v; };
  const pos = (el, x, y) => { el.style.left = x + 'px'; if (y != null) el.style.top = y + 'px'; };
  const pad2 = n => String(n).padStart(2, '0');

  function renderClock(t) {
    const uk = zoned(t, 'uk'), kr = zoned(t, 'kr');
    const split = uk.key !== kr.key;
    const lay = split ? L.split : L.merged;

    for (const [k, z] of [['uk', uk], ['kr', kr]]) {
      const el = $('time-' + k);
      setText(el.querySelector('.hh'), pad2(z.h));
      setText(el.querySelector('.mm'), pad2(z.mi));
    }
    setText($('wd-uk'), WEEKDAYS[uk.dow]);
    setText($('wd-kr'), WEEKDAYS[kr.dow]);
    setText($('date-uk'), `${uk.m}/${uk.d}`);
    setText($('date-kr'), `${kr.m}/${kr.d}`);

    // 요일·날짜: 같은 날이면 가운데 하나로 합침
    pos($('wd-uk'), split ? 270 : 540, lay.wdY);
    pos($('wd-kr'), split ? 810 : 540, lay.wdY);
    pos($('date-uk'), split ? 270 : 540, lay.dateY);
    pos($('date-kr'), split ? 810 : 540, lay.dateY);
    $('wd-kr').style.opacity = $('date-kr').style.opacity = split ? 1 : 0;

    const div = $('divider');
    div.style.top = lay.divTop + 'px';
    div.style.height = lay.divH + 'px';

    // 타임라인: 각 나라의 '오늘' 한 줄 + 핀 (같은 날엔 한국 핀만 아래 줄에)
    for (const [k, z] of [['uk', uk], ['kr', kr]]) {
      const [x, y, w, h] = lay[k], lane = $('lane-' + k);
      lane.style.left = x + 'px'; lane.style.top = y + 'px';
      lane.style.width = w + 'px'; lane.style.height = h + 'px';
      paintLane(k, z, t);
      const below = k === 'kr' && !split;
      $('pin-' + k).classList.toggle('below', below);
      pos($('pin-' + k), x + w * dayFrac(z), below ? y + h : y);
    }

    stage.classList.toggle('split', split);
  }

  const dayFrac = z => (z.h + z.mi / 60 + z.s / 3600) / 24;

  // 막대 색: 고도 → 밤(남색) · 여명(보라→장미) · 해(주황→금빛→밝은 햇빛)
  const BAR = [
    [-90, [ 26,  32,  66]],
    [-18, [ 26,  32,  66]],
    [-12, [ 44,  42,  96]],
    [ -6, [ 96,  60, 128]],
    [ -2, [196,  88, 112]],
    [  2, [255, 138,  76]],
    [ 10, [255, 184,  92]],
    [ 25, [255, 214, 132]],
    [ 50, [255, 238, 190]],
    [ 90, [255, 238, 190]],
  ];
  function barColor(el) {
    for (let i = 1; i < BAR.length; i++) {
      if (el <= BAR[i][0]) {
        const [e0, a] = BAR[i - 1], [e1, b] = BAR[i];
        const f = Math.max(0, Math.min(1, (el - e0) / (e1 - e0)));
        return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(',')})`;
      }
    }
  }
  const painted = {};
  function paintLane(k, z, t) {
    if (painted[k] === z.key) return;          // 날짜가 바뀔 때만 다시 칠함
    painted[k] = z.key;
    const hf = dayFrac(z), stops = [];
    for (let i = 0; i <= 96; i++) {            // 15분 간격
      const tt = t + (i / 96 - hf) * 86400000;
      stops.push(`${barColor(sunElevation(tt, ZONES[k].lat, ZONES[k].lon))} ${(i / 96 * 100).toFixed(2)}%`);
    }
    $('lane-' + k).style.backgroundImage = `linear-gradient(90deg, ${stops.join(', ')})`;
  }

  function renderSun(t) {
    for (const k of ['uk', 'kr']) {
      const [r, g, b, o, s, fb] = sunLook(sunElevation(t, ZONES[k].lat, ZONES[k].lon));
      for (const el of [$('halo-' + k), $('flag-' + k)]) {
        el.style.setProperty('--hc', `${r | 0}, ${g | 0}, ${b | 0}`);
        el.style.setProperty('--ho', o.toFixed(3));
        el.style.setProperty('--hs', s.toFixed(3));
        el.style.setProperty('--fb', fb.toFixed(3));
        el.style.setProperty('--fsat', (.35 + .65 * (fb - .3) / .7).toFixed(3)); // 밤엔 색도 빠짐
      }
    }
  }

  // ---------- 루프 ----------
  let lastSec = null, lastSunT = -Infinity, lastFrac = 0;
  function frame() {
    const t = now();
    const frac = (((t % 60000) + 60000) % 60000) / 60000;
    fill.style.strokeDashoffset = perimeter * (1 - frac);
    if (frac < lastFrac - 0.5) {           // 1분 완성 → 잔광
      flash.classList.remove('go'); void flash.getBBox(); flash.classList.add('go');
    }
    lastFrac = frac;

    const sec = Math.floor(t / 1000);
    if (sec !== lastSec) { lastSec = sec; renderClock(t); }
    if (Math.abs(t - lastSunT) > 30000) { lastSunT = t; renderSun(t); }
    requestAnimationFrame(frame);
  }

  layoutScreen();
  renderSun(now());
  renderClock(now());
  requestAnimationFrame(() => requestAnimationFrame(() => {
    stage.classList.remove('init');
    stage.classList.add('anim');
  }));
  requestAnimationFrame(frame);

  // ---------- 상시 켜두기 ----------
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('touchend', keepAwake, { passive: true });
  keepAwake();

  // 매일 영국 04:00에 새로고침 (업데이트 반영 + 장기 실행 안정성)
  if (!simulated) {
    setInterval(() => {
      const uk = zoned(Date.now(), 'uk');
      if (uk.h === 4 && uk.mi === 0 && performance.now() > 120000) location.reload();
    }, 30000);
  }

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
